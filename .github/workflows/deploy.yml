name: Deploy

# Runs on a self-hosted runner on the homelab host `schroeder`, which has a
# local clone of this repo at /home/snoopy/DogBot9000. On every push to `main`
# it rebuilds the image and recreates the `dogbot` container.
#
# SECURITY: this repo is public. A self-hosted runner on a public repo must
# NEVER be triggered by `pull_request` (fork PRs could run arbitrary code on
# the host). Only `push` to the protected default branch and manual dispatch
# are enabled, so only repo collaborators can trigger a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-DogBot9000
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, schroeder, dogbot]
    steps:
      - name: Deploy DogBot9000
        run: /home/snoopy/bin/deploy-bot.sh DogBot9000 main
